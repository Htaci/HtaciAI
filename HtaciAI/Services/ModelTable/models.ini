; ── 已知缺口（记录在此，供日后补齐）────────────────────────────────────────
;
; 1. 「关闭思考 / effort=none」这个档位表达不出来。OpenAI 的 gpt-6-sol / gpt-6-luna、
;    DeepSeek 的 deepseek-flash / v4-pro 都支持用它关闭思考，而应用侧 ThinkingMode
;    只有「NoThink（写 thinking 开关对象）」和「Default（什么都不写）」。
;    对 provider 设成 ReasoningEffort 的端点，NoThink 目前等同于 Default（都不发字段）。
; 2. Gemini 的 thinking_level 在 provider 那一层没有对应写法，档位记了也发不出去。
; 3. temperature / max_tokens 在应用里还没有下发请求体的地方，这两个字段目前只驱动界面。
;
; 这三条都属于 provider 协议层的事，模型表本身已经如实记录了模型那一侧的事实。


; ═══ 月之暗面 Kimi ═══════════════════════════════════════════════════════════
;
; 三家的思考开关形态都不一样，这里如实分别记录：
;   Kimi  — k3 是 reasoning_effort 档位（思考强制开启）；k2.6 是 thinking.type 布尔开关。
;   GLM   — 多数是 thinking.type 布尔开关；5.2 及以上才有 reasoning_effort 档位。
;   Grok  — reasoning.effort 档位，思考强制开启。
; 实际能不能发出去取决于 provider 的 ThinkingField，档位只记录模型那一侧的事实。


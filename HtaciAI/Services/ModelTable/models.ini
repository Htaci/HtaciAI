; ─────────────────────────────────────────────────────────────────────────────
; HtaciAI 内置模型表
;
; 这是「模型长什么样」的权威来源。改完执行下面这行重新生成 C# 常量，然后编译：
;
;     dotnet run --project tools/ModelTableGen
;
; 生成物是 Services/ModelTable/BuiltinModelTable.g.cs，不要手改它。
;
; ── 两级匹配 ────────────────────────────────────────────────────────────────
;
; 添加模型时会拿模型调用 id 去查这张表，命中结果分三种：
;
;   1. 命中 [model:...]      → 配置完整，界面上没有提示。
;   2. 只命中 [vendor:...]   → 只知道是谁家的（头像对得上），配置缺失，
;                              该模型会挂一个黄色感叹号，点开可直接补配置。
;   3. 都没命中              → 挂灰色问号，所有能力取最保守的默认值。
;
; 保守默认值的含义：数组 content 按「不支持」处理，思考参数一概不下发。
; 猜错的代价比缺省大得多 —— 猜「支持数组 content」会让不支持的服务端直接报错。
;
; ── 格式 ────────────────────────────────────────────────────────────────────
;
; 段名 [vendor:xxx] / [model:xxx]。模型 id 本身可以带冒号（qwen2.5:7b），
; 解析时只按第一个冒号切分，所以这类 id 直接写就行。
;
; 注释：整行以 ; 或 # 开头；行内注释也认，但 # / ; 前面必须有空白。
; 未知的键名会直接导致生成失败 —— 写错一个键名如果被静默忽略，
; 表现是「某个字段莫名其妙没生效」，那种问题在几百行里极难查。
;
; ── 两处「不猜」约定 ────────────────────────────────────────────────────────
;
; context / max_out：不知道就写 unknown（或省略），会被记成 -1（未知）。
;   不要凭印象填数字。每个条目的 source 栏记下数字的出处，方便日后回查。
;
; array_content / temperature：三态 yes / no / unknown，省略即 unknown。
;   unknown 表示「不确定」，调用方会按最保守的方式处理，而不是当作「不支持」写死。
;
; thinking / strengths 是两件事：thinking 是有没有思考能力（开关能不能点亮），
;   strengths 是能被下发的档位集合（开关后面那个下拉里有什么）。各家档位名字不统一，
;   这里统一用 wire 值：minimal / low / medium / high / xhigh / max。
;
; ─────────────────────────────────────────────────────────────────────────────


; ═══ 开发商 ══════════════════════════════════════════════════════════════════
;
; 开发商 = 谁的模型，不是谁在转发。DeepSeek 的模型经火山引擎转发，头像也该是 DeepSeek。
; 所以这一层只用于「认脸」和归属展示，与用户配置的服务商无关。
;
; match 是从模型 id 反推开发商的正则，一律锚定开头（^），否则跨厂商的 id
; 会由声明顺序而不是前缀决定归属。顺序即优先级 —— 从具体到宽泛排列。
;
; icon 是 Assets/icon/models/ 下的图标名，省略则用开发商 id。之所以要能覆盖，
; 是因为图标是按品牌画的：智谱的图标文件叫 glm.svg，xAI 的叫 grok.svg。

[vendor:anthropic]
name = Anthropic
icon = claude
match = ^(?:anthropic\.)?claude

[vendor:openai]
name = OpenAI
match = ^(?:gpt|o[1-9]($|[-.])|chatgpt|codex|dall-e|text-embedding|sora|whisper|davinci|babbage)

[vendor:google]
name = Google
match = ^(?:gemini|gemma|palm|imagen|veo|learnlm|lyria)

[vendor:deepseek]
name = DeepSeek
match = ^deepseek

[vendor:alibaba]
name = 阿里通义
icon = qwen
match = ^(?:qwen|qwq|qvq|tongyi)

[vendor:moonshot]
name = 月之暗面
icon = kimi
match = ^(?:kimi|moonshot|k3($|[-_.]))

[vendor:zhipu]
name = 智谱
icon = glm
match = ^(?:glm|chatglm|codegeex|cogview|cogvideo|zai)

[vendor:xai]
name = xAI
icon = grok
match = ^grok

[vendor:meta]
name = Meta
match = ^(?:llama|meta-)

[vendor:mistral]
name = Mistral
match = ^(?:mistral|mixtral|codestral|magistral|devstral|ministral|pixtral|voxtral)

[vendor:bytedance]

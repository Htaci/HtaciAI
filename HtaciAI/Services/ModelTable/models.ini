; ═══ 模型 ════════════════════════════════════════════════════════════════════
;
; 每个条目的字段：
;
;   vendor       必填。开发商 id，必须是上面某个 [vendor:...] 段。
;   name         备注名称（显示用）。省略则用模型 id。
;   aliases      别名，逗号分隔。中转站/聚合商的其它写法放这里 ——
;                它们只参与匹配，不入库。不确定是否同一型号时宁可另开一条条目。
;   context      上下文窗口 token 数。unknown = 未知。
;   max_out      最大输出 token 数。unknown = 未知。
;   capabilities 逗号分隔，取值：reasoning / tools / completion / vision /
;                audio / video / embedding / rerank（与设置页的能力标签一致）。
;   array_content 是否接受数组格式的 message content（多模态消息）。yes/no/unknown。
;   thinking      是否支持思考模式。yes/no。
;   strengths     支持的思考档位，逗号分隔。
;   temperature   是否接受 temperature 参数。yes/no/unknown。
;   source        官方文档 URL。纯维护线索，不参与匹配。
;
; 规范化匹配（无需写进 aliases 的部分）：查表前会把 id 转小写、去掉
;   命名空间前缀（openai/gpt-4o → gpt-4o）、把下划线换成连字符，
;   并剥掉售卖形式的变体后缀（:free / :nitro / (beta) / -2024-08-06 这类日期快照）。
;   反过来，「-thinking 是不是同一个模型」这种没有确定答案的判断不自动做，
;   需要时显式写进 aliases。
;
; 注意：价格不进这张表。它按区域与时段浮动（DeepSeek 就分峰谷价），
; 写死在这里必然误导，请在各模型自己的配置里填。
;
; ── 数字的记法约定 ──────────────────────────────────────────────────────────
;
; context / max_out 优先用官方文档给出的「精确数字」（如 393216、1050000）。
; 文档只写约数（1M / 128K / 64k）时，按十进制读：1M = 1000000、128K = 128000、
; 64k = 64000，并把文档原文写进 note。这是一条「明写在案的约定」，
; 不是逐条猜测 —— 有约定才能复核，猜出来的数字过半年就没人敢动了。




; ═══ OpenAI ═════════════════════════════════════════════════════════════════
;
; 思考参数是顶层的 reasoning_effort（Chat Completions）/ reasoning.effort（Responses）。
; 各家档位子集不同，且「不支持某个档位」是真的会 400（不是被忽略），所以逐条写准。
;
; 关于 temperature：文档给的是「条件式」规则 ——「仅当 effort=none 时接受」。
; 三态表达不了条件，这类一律记 unknown 并在 note 里写清原规则，不要压成 yes 或 no。

[model:gpt-6-astra]
vendor = openai
name = GPT-6 Astra
context = 1050000
max_out = 128000
capabilities = tools, completion, vision, reasoning
array_content = yes
thinking = yes
strengths = low, medium, high, xhigh, max
temperature = no
source = https://developers.openai.com/api/docs/models/gpt-6-astra
note = 文档另记「最大输入 922000」小于 context。不支持 none/minimal，故 temperature 恒被拒。工具调用仅 Responses API 支持。

